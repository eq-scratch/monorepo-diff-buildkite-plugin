env:
  BUILDKITE_PLUGIN_MONOREPO_DIFF_BUILDKITE_PLUGIN_LOCAL_MODE: true

agents:
  - "queue=sandbox"

steps:
  - label: ":shell: Shellcheck"
    plugins:
      - shellcheck#v1.4.0:
          files:
            - hooks/**
            - lib/**
            - commands/**
      - ".buildkite/plugins/wait-for-docker"
      - kubernetes:
          mirrorVolumeMounts: true
          podSpecPatch:
            containers:
              - name: container-0
                volumeMounts:
                  - mountPath: /var/run/
                    name: docker-sock
            volumes: &volumes
              - name: docker-sock
                emptyDir: {}
          sidecars: &sidecars
            - image: public.ecr.aws/docker/library/docker:28.1.1-dind
              command: [dockerd-entrypoint.sh, "--data-root=/workspace/docker-data-root"]
              env:
                - name: DOCKER_TLS_CERTDIR
                  value: ""
                - name: TEST_INTEGRATION_USE_SNAPSHOTTER
                  value: "true"
              volumeMounts:
                - mountPath: /var/run/
                  name: docker-sock
              securityContext:
                privileged: true
                allowPrivilegeEscalation: true

  - label: ":sparkles: Lint"
    plugins:
      - plugin-linter#v3.3.0:
          id: monorepo-diff
      - ".buildkite/plugins/wait-for-docker"
      - kubernetes:
          mirrorVolumeMounts: true
          podSpecPatch:
            containers:
              - name: container-0
                volumeMounts:
                  - mountPath: /var/run/
                    name: docker-sock
            volumes: *volumes
          sidecars: *sidecars

  - label: ":golang: Test"
    command: go test ./...
    plugins:
      #- docker#v5.13.0:
      #    workdir: /plugin
      - kubernetes:
          podSpecPatch:
            containers:
              - name: container-0
                image: golang

  - label: ":linux: Build"
    command: make local
    artifact_paths: monorepo-diff-buildkite-plugin
    plugins:
      #- docker#v5.13.0:
      #    workdir: /plugin
      - kubernetes:
          podSpecPatch:
            containers:
              - name: container-0
                image: golang

  - wait: ~

  - label: ":bomb: Triggers"
    plugins:
      - artifacts#v1.9.4:
          download:
            - "monorepo-diff-buildkite-plugin"
      - ${BUILDKITE_PULL_REQUEST_REPO:-$BUILDKITE_REPO}#${BUILDKITE_COMMIT}:
          diff: "cat ./e2e/one-match-one-miss"
          log_level: "debug"
          watch:
            - path: "foo-service/"
              config:
                trigger: "foo-service"
            - path: "hello-service/"
              config:
                trigger: "this-pipeline-does-not-exists"
            - path: "foo-service/"
              config:
                command: "echo running command"
          hooks:
            - command: echo "command hook 1"
            - command: echo "command hook 2"

  - label: ":bomb: Testing notifications"
    plugins:
      - artifacts#v1.9.4:
          download:
            - "monorepo-diff-buildkite-plugin"
      - ${BUILDKITE_PULL_REQUEST_REPO:-$BUILDKITE_REPO}#${BUILDKITE_COMMIT}:
          diff: "cat ./e2e/multiple-paths"
          watch:
            - path:
                - "user-service/infrastructure/"
              config:
                command: "echo i-am-running"

  - label: ":bomb: Testing groups"
    plugins:
      - artifacts#v1.9.4:
          download:
            - "monorepo-diff-buildkite-plugin"
      - ${BUILDKITE_PULL_REQUEST_REPO:-$BUILDKITE_REPO}#${BUILDKITE_COMMIT}:
          diff: "cat ./e2e/multiple-paths"
          watch:
            - path:
                - "user-service/infrastructure/"
                - "product-service/infrastructure/"
              config:
                group: "my group"
                steps:
                  - command: "echo i-am-running-in-a-group"
                  - command: "echo i-am-also-running-in-a-group"
            - path:
                - "user-service/serverless.yaml"
              config:
                group: "my group"
                steps:
                  - commands:
                    - "echo i-am-running-in-a-duplicate-group"
                    - "echo i-am-also-running-in-a-duplicate-group"
            - path:
                - "user-service/"
              config:
                group: "another group"
                steps:
                  - command: "echo i-am-running-in-a-group"
                  - command: "echo i-am-also-running-in-a-group"

  - label: ":bomb: Testing everything in a group"
    plugins:
      - artifacts#v1.9.4:
          download:
            - "monorepo-diff-buildkite-plugin"
      - ${BUILDKITE_PULL_REQUEST_REPO:-$BUILDKITE_REPO}#${BUILDKITE_COMMIT}:
          diff: "cat ./e2e/multiple-paths"
          group: "my group"
          watch:
            - path:
                - "user-service/infrastructure/"
                - "product-service/infrastructure/"
              config:
                steps:
                  - command: "echo i-am-running-in-a-group"
                  - command: "echo i-am-also-running-in-a-group"
            - path:
                - "user-service/serverless.yaml"
              config:
                steps:
                  - command: "echo i-am-running-in-a-group-2"
                  - command: "echo i-am-also-running-in-a-group-2"
            - path:
                - "user-service/"
              config:
                steps:
                  - command: "echo i-am-running-in-a-group-3"
                  - command: "echo i-am-also-running-in-a-group-3"

  - label: ":bomb: Testing hooks"
    plugins:
      - artifacts#v1.9.4:
          download:
            - "monorepo-diff-buildkite-plugin"
      - ${BUILDKITE_PULL_REQUEST_REPO:-$BUILDKITE_REPO}#${BUILDKITE_COMMIT}:
          diff: "cat ./e2e/multiple-paths"
          watch:
            - path: "user-service/"
              config:
                trigger: "user-service"
            - path:
                - "user-service/infrastructure/"
                - "product-service/infrastructure/"
              config:
                trigger: "validate-infrastructure"
            - path:
                - "do-not-trigger/"
              config:
                trigger: "this-pipeline-does-not-exists"
          hooks:
            - command: echo "command hook 1"

  - label: ":bomb: Testing wait"
    plugins:
      - artifacts#v1.9.4:
          download:
            - "monorepo-diff-buildkite-plugin"
      - ${BUILDKITE_PULL_REQUEST_REPO:-$BUILDKITE_REPO}#${BUILDKITE_COMMIT}:
          diff: "cat ./e2e/multiple-paths"
          watch:
            - path:
                - "user-service/infrastructure/"
                - "product-service/infrastructure/"
              config:
                command: "echo i-am-running"
          wait: true

  - label: ":bomb: Testing triggers and commands"
    plugins:
      - artifacts#v1.9.4:
          download:
            - "monorepo-diff-buildkite-plugin"
      - ${BUILDKITE_PULL_REQUEST_REPO:-$BUILDKITE_REPO}#${BUILDKITE_COMMIT}:
          diff: "cat ./e2e/commands-or-triggers"
          watch:
            - path: "user-service/"
              config:
                trigger: "user-service"
            - path:
                - "hello/bin/"
                - "world/bin/"
              config:
                command: "echo hello-world"
            - path:
                - "global/"
              config:
                command: "buildkite-agent pipeline upload ./e2e/global/.buildkite/pipeline.yml"
            - path:
                - "do-not-trigger/"
              config:
                trigger: "this-pipeline-does-not-exists"
            - path:
                - "do-not-run-command/"
              config:
                command: "echo this-does-not-run"
            - path:
                - "global/"
              config:
                group: "this is a group"
                command: "echo this-does-not-run"

  - label: ":testtube: Testing default config"
    plugins:
      - artifacts#v1.9.4:
          download:
            - "monorepo-diff-buildkite-plugin"
      - ${BUILDKITE_PULL_REQUEST_REPO:-$BUILDKITE_REPO}#${BUILDKITE_COMMIT}:
          diff: "cat ./e2e/commands-or-triggers"
          watch:
            - path: "not_a_path/"
              config:
                command: echo "This shouldn't run"
            - default:
                command: "echo hello-world"

  - label: ":testtube: Testing default config with map"
    plugins:
      - artifacts#v1.9.4:
          download:
            - "monorepo-diff-buildkite-plugin"
      - ${BUILDKITE_PULL_REQUEST_REPO:-$BUILDKITE_REPO}#${BUILDKITE_COMMIT}:
          diff: "cat ./e2e/commands-or-triggers"
          watch:
            - path: "not_a_path/"
              config:
                command: echo "This shouldn't run"
            - default:
                config:
                  command: "echo hello-world"
